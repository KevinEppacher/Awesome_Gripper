controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    gripper_controller:
      type: position_controllers/JointPositionController

gripper_controller:
  ros__parameters:
    joints:
      - gripper_joint_1_right
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      gripper_joint_1_right:
        p: 10.0
        i: 0.0
        d: 0.0